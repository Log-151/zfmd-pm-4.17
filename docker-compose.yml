services:
  db:
    image: postgres:16
    container_name: zfmd_pg
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  odoo:
    image: odoo:17
    container_name: zfmd_odoo
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf
      - ./odoo/data:/var/lib/odoo
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
