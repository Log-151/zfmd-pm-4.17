name: zfmd-pm

services:
  db:
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    restart: unless-stopped
    environment:
      POSTGRES_DB: zfmd-PM
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      ODOO_DB_USER: odoo
      ODOO_DB_PASSWORD_FILE: /run/secrets/odoo_db_password
    secrets:
      - postgres_admin_password
      - odoo_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/initdb/10-create-odoo-user.sh:/docker-entrypoint-initdb.d/10-create-odoo-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zfmd-PM"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ODOO_BASE_CONF: /etc/odoo/odoo.prod.conf
      ODOO_DB_HOST: db
      ODOO_DB_PORT: "5432"
      ODOO_DB_USER: odoo
      ODOO_DB_PASSWORD_FILE: /run/secrets/odoo_db_password
      ODOO_DB_NAME: zfmd-PM
      ADMIN_PASSWORD_FILE: /run/secrets/odoo_admin_password
      LIST_DB: "False"
      PROXY_MODE: "True"
      PRODUCTION_MODE: "True"
    secrets:
      - odoo_db_password
      - odoo_admin_password
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    volumes:
      - odoo_data:/var/lib/odoo
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8069),5); s.close()",
        ]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 60s
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend
      - frontend

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  odoo_db_password:
    file: ./secrets/odoo_db_password
  odoo_admin_password:
    file: ./secrets/odoo_admin_password

volumes:
  postgres_data:
  odoo_data:

networks:
  backend:
    internal: true
  frontend:
